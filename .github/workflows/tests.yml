name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: "Lint (Pint) - ${{ matrix.dependency-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependency-version: ['prefer-lowest', 'prefer-stable']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

      - run: composer lint

  test:
    name: "PHP ${{ matrix.php }} - ${{ matrix.dependency-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependency-version: ['prefer-lowest', 'prefer-stable']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

      - run: composer test
